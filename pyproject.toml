[project]
name = "adjudication"
version = "0.1.0"
description = "Agentic adjudication under regulatory constraint"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2.22",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "cryptography>=46",
    "rfc8785>=0.1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mcp>=2.3", "opentelemetry-sdk>=1.42"]
mcp = ["mcp>=2.3"]
tracing = ["opentelemetry-api>=1.42"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["adjudication"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RET", "ARG", "PTH"]
ignore = ["E501"]
